name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHONIOENCODING: utf-8
  # CI-only value: production must supply its own long random SECRET_KEY.
  SECRET_KEY: ci-only-not-a-real-secret

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Smoke test routes (no server required)
        # /readyz answers 503 + status=degraded when no GEMINI_API_KEY is set,
        # which is the expected state in CI without secrets.
        run: |
          python -c "from run import app; c = app.test_client(); h = c.get('/healthz'); assert h.status_code == 200 and h.get_json()['status'] == 'ok', h.data; r = c.get('/readyz'); assert r.status_code in (200, 503) and r.get_json()['status'] in ('ready', 'degraded'), r.data; print('healthz', h.get_json()); print('readyz', r.get_json())"
