[project]
name = "pedagogical-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==2.3.3",
    "flask-sqlalchemy==3.0.5",
    "python-dotenv==1.0.0",
    "pymupdf>=1.26.0",
    "python-docx>=1.1.2",
    "chromadb>=0.5.23",
    "google-genai>=1.5.0",
    "pydantic>=2.0.0",
    "gunicorn",
]

[tool.vercel]
entrypoint = "run:app"
