{% extends "base.html" %}

{% block title %}نتيجة الجذاذة - Pedagogical AI{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">نتيجة الجذاذة</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.print()">طباعة</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="downloadAsPDF()">تحميل PDF</button>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="window.location.href='/create-lesson'">جذاذة جديدة</button>
    </div>
</div>

<div class="container" dir="rtl" lang="ar">
    <div id="loadingMessage" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">جاري التحميل...</span>
        </div>
        <p class="mt-3">جاري تحميل الجذاذة...</p>
    </div>
    
    <div id="lessonPlanContent" class="d-none">
        <!-- Lesson plan will be dynamically loaded here -->
    </div>
    
    <div id="noLessonPlan" class="alert alert-warning d-none">
        <h4 class="alert-heading">لا توجد جذاذة</h4>
        <p>لم يتم العثور على بيانات الجذاذة. يرجى إنشاء جذاذة جديدة.</p>
        <hr>
        <button type="button" class="btn btn-warning" onclick="window.location.href='/create-lesson'">إنشاء جذاذة جديدة</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function downloadAsPDF() {
    alert('ميزة تحميل PDF قيد التطوير. يمكنك استخدام طباعة المتصفح وحفظ كـ PDF.');
}

$(document).ready(function() {
    // Load lesson plan from session storage
    const lessonPlanData = sessionStorage.getItem('lessonPlan');
    const retrievedContextCount = sessionStorage.getItem('retrievedContextCount');
    
    $('#loadingMessage').addClass('d-none');
    
    if (lessonPlanData) {
        const lessonPlan = JSON.parse(lessonPlanData);
        renderLessonPlan(lessonPlan, retrievedContextCount);
    } else {
        $('#noLessonPlan').removeClass('d-none');
    }
});

function renderLessonPlan(lessonPlan, retrievedContextCount) {
    let html = `
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">${lessonPlan.title}</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>المادة:</strong> ${lessonPlan.subject}</p>
                    <p><strong>المستوى:</strong> ${lessonPlan.educational_level}</p>
                    <p><strong>المدة:</strong> ${lessonPlan.duration} دقيقة</p>
                </div>
                <div class="col-md-6">
                    <p><strong>الكفاءة المستهدفة:</strong> ${lessonPlan.competency}</p>
                    <p><strong>المصادر المسترجعة:</strong> ${retrievedContextCount}</p>
                </div>
            </div>
        </div>
    </div>`;

    if (lessonPlan.learning_objectives && lessonPlan.learning_objectives.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>الأهداف التعليمية</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.learning_objectives.map(obj => '<li>' + obj + '</li>').join('')}
            </ul>
        </div>
    </div>`;
    }

    if (lessonPlan.prerequisites && lessonPlan.prerequisites.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>المكتسبات القبلية</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.prerequisites.map(req => '<li>' + req + '</li>').join('')}
            </ul>
        </div>
    </div>`;
    }

    if (lessonPlan.materials && lessonPlan.materials.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>الوسائل التعليمية</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.materials.map(mat => '<li>' + mat + '</li>').join('')}
            </ul>
        </div>
    </div>`;
    }

    if (lessonPlan.key_concepts && lessonPlan.key_concepts.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>المفاهيم والمصطلحات الأساسية</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.key_concepts.map(concept => '<li>' + concept + '</li>').join('')}
            </ul>
        </div>
    </div>`;
    }

    if (lessonPlan.introduction) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>التمهيد</h5>
        </div>
        <div class="card-body">
            <p>${lessonPlan.introduction}</p>
        </div>
    </div>`;
    }

    if (lessonPlan.lesson_phases && lessonPlan.lesson_phases.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>مراحل الدرس</h5>
        </div>
        <div class="card-body">`;
        
        lessonPlan.lesson_phases.forEach(phase => {
            html += `
            <div class="mb-4 p-3 border rounded">
                <h6 class="border-bottom pb-2">${phase.name} (${phase.duration} دقيقة)</h6>
                
                <div class="row mt-3">
                    <div class="col-md-6">
                        <strong>دور المعلم:</strong>
                        <ul>
                            ${phase.teacher_actions.map(action => '<li>' + action + '</li>').join('')}
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <strong>دور المتعلم:</strong>
                        <ul>
                            ${phase.learner_actions.map(action => '<li>' + action + '</li>').join('')}
                        </ul>
                    </div>
                </div>`;

            if (phase.guiding_questions && phase.guiding_questions.length > 0) {
                html += `
                <div class="mt-3">
                    <strong>الأسئلة الموجهة:</strong>
                    <ul>
                        ${phase.guiding_questions.map(q => '<li>' + q + '</li>').join('')}
                    </ul>
                </div>`;
            }

            if (phase.expected_responses && phase.expected_responses.length > 0) {
                html += `
                <div class="mt-3">
                    <strong>الإجابات المنتظرة:</strong>
                    <ul>
                        ${phase.expected_responses.map(r => '<li>' + r + '</li>').join('')}
                    </ul>
                </div>`;
            }

            if (phase.activities && phase.activities.length > 0) {
                html += `
                <div class="mt-3">
                    <strong>الأنشطة:</strong>
                    <ul>
                        ${phase.activities.map(a => '<li>' + a + '</li>').join('')}
                    </ul>
                </div>`;
            }

            html += `</div>`;
        });
        
        html += `</div></div>`;
    }

    if (lessonPlan.activities && lessonPlan.activities.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>الأنشطة والتجارب</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.activities.map(act => '<li>' + act + '</li>').join('')}
            </ul>`;
        
        if (lessonPlan.experiments && lessonPlan.experiments.length > 0) {
            html += `<h6 class="mt-3">التجارب:</h6>
            <ul>
                ${lessonPlan.experiments.map(exp => '<li>' + exp + '</li>').join('')}
            </ul>`;
        }
        
        html += `</div></div>`;
    }

    if (lessonPlan.assessment) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>التقويم</h5>
        </div>
        <div class="card-body">
            <p>${lessonPlan.assessment}</p>
        </div>
    </div>`;
    }

    if (lessonPlan.remediation) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>الدعم والمعالجة</h5>
        </div>
        <div class="card-body">
            <p>${lessonPlan.remediation}</p>
        </div>
    </div>`;
    }

    if (lessonPlan.summary) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>خلاصة الدرس</h5>
        </div>
        <div class="card-body">
            <p>${lessonPlan.summary}</p>
        </div>
    </div>`;
    }

    if (lessonPlan.homework) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>الواجب المنزلي</h5>
        </div>
        <div class="card-body">
            <p>${lessonPlan.homework}</p>
        </div>
    </div>`;
    }

    if (lessonPlan.sources && lessonPlan.sources.length > 0) {
        html += `
    <div class="card mb-4">
        <div class="card-header">
            <h5>المصادر</h5>
        </div>
        <div class="card-body">
            <ul>
                ${lessonPlan.sources.map(src => '<li>' + src + '</li>').join('')}
            </ul>
        </div>
    </div>`;
    }

    html += `
    <div class="row mt-4">
        <div class="col-md-12 text-center">
            <button type="button" class="btn btn-primary" onclick="window.location.href='/create-lesson'">إنشاء جذاذة جديدة</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">العودة إلى لوحة التحكم</button>
        </div>
    </div>`;

    $('#lessonPlanContent').html(html).removeClass('d-none');
}
</script>
{% endblock %}
